<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="css/style.css" rel="stylesheet">
    <script src="index.js" defer></script>
</head>

<body>

    <div class="button-container">
        <button id="btn-rock" value="rock">Rock</button>
        <button id="btn-paper" value="paper">Paper</button>
        <button id="btn-scissors" value="scissors">Scissors</button>
    </div>

    <div class="score-container">
        <div class="player-score-container">
            <p id="pscore">Player</p>
            <div id="player-score">0</div>
        </div>
        <div class="computer-score-container">
            <p id="cscore">Computer</p>
            <div id="computer-score">0</div>
        </div>
    </div>

    <div class="results">

    </div>

</body>

</html>
